<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart MCH System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Global Language Switcher -->
    <div id="global-lang-switcher" style="position:fixed;top:10px;right:900px;z-index:99999;display:flex;gap:4px;background:rgba(0,0,0,0.2);border-radius:8px;padding:3px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);">
      <button onclick="switchAppLang('en')" id="glb-en" style="padding:4px 10px;border-radius:5px;border:none;font-size:0.75rem;font-weight:700;cursor:pointer;background:#1a6b8a;color:white;font-family:'Inter',sans-serif;">EN</button>
      <button onclick="switchAppLang('si')" id="glb-si" style="padding:4px 10px;border-radius:5px;border:none;font-size:0.75rem;font-weight:700;cursor:pointer;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);font-family:'Noto Sans Sinhala',sans-serif;">සි</button>
      <button onclick="switchAppLang('ta')" id="glb-ta" style="padding:4px 10px;border-radius:5px;border:none;font-size:0.75rem;font-weight:700;cursor:pointer;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);font-family:'Noto Sans Tamil',sans-serif;">த</button>
    </div>

    <script>
      function switchAppLang(lang) {
        localStorage.setItem('lang', lang);
        ['en','si','ta'].forEach(l => {
          const btn = document.getElementById('glb-' + l);
          if (btn) {
            btn.style.background = l === lang ? '#1a6b8a' : 'rgba(255,255,255,0.1)';
            btn.style.color = l === lang ? 'white' : 'rgba(255,255,255,0.8)';
          }
        });
        window.dispatchEvent(new CustomEvent('app-lang-change', { detail: lang }));
      }
      const currentLang = localStorage.getItem('lang') || 'en';
      document.addEventListener('DOMContentLoaded', () => switchAppLang(currentLang));
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
